  # STORAGE
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary

  # DASHBOARD
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # AUTH
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    # USER
    User:
      type: object
      required: [id, name, email, puesto, area, udn_id, role, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        puesto:
          type: string
        area:
          type: string
        profile_id:
          type: ["integer", "null"]
        udn_id:
          type: ["integer", "null"]
        role:
          type: string
          enum: [superadmin, admin, user]
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, password, puesto, area]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        puesto:
          type: string
        area:
          type: string
        profile_id:
          type: ["integer", "null"]
        udn_id:
          type: ["integer", "null"]
        role:
          type: string
          enum: [superadmin, admin, user]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        puesto:
          type: string
        area:
          type: string
        profile_id:
          type: ["integer", "null"]
        udn_id:

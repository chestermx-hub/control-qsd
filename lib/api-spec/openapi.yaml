  # AUDIT CAPTURES
  /audit-captures:
    get:
      operationId: listAuditCaptures
      tags: [auditCaptures]
      summary: List audit captures
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Filter by date (YYYY-MM-DD)
        - name: panel_id
          in: query
          schema:
            type: integer
        - name: zone_id
          in: query
          schema:
            type: integer
          description: Filter by audited zone
      responses:
        "200":
          description: List of audit captures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditCapture"
